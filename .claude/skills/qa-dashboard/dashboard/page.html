<!doctype html>
<html lang="en" data-theme="geist">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic QA Dashboard</title>
<!--THEME_BOOT-->
<style>/*THEME_CSS*/</style>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 var(--font-sans); }
  a { color: var(--link); }
  .top { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg-chrome); color: var(--fg-on-chrome); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
  .logo { background: var(--logo-bg); color: var(--logo-fg); font: var(--display-weight) 15px/1 var(--font-display); letter-spacing: .06em; padding: 7px 9px; border-radius: var(--radius-sm); }
  .proj { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-wrap { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .proj-sub { font-size: 12px; color: var(--fg-on-chrome-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-sub:empty { display: none; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-on-chrome-muted); white-space: nowrap; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chrome-ok); }
  .live.stale .dot { background: var(--chrome-warn); }
  .live.snapshot .dot { background: var(--fg-on-chrome-muted); }
  .shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) auto; min-height: calc(100vh - var(--topbar-h)); }

  /* AIQA's shell: header pills, the jump box, and the run panel on the right of every page. */
  .pills { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .tchip { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 12px; border-radius: var(--radius-pill); border: 1px solid color-mix(in srgb, var(--fg-on-chrome) 22%, transparent); background: transparent; color: var(--fg-on-chrome); font: 600 12.5px/1 var(--font-sans); text-decoration: none; white-space: nowrap; cursor: pointer; }
  .pills .tchip { display: inline-flex; align-items: center; }
  .tchip:hover { background: var(--bg-rail-active); }
  .tchip:focus-visible { outline: 2px solid var(--focus-chrome); outline-offset: 1px; }
  .tchip.turn { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .tchip .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-on-chrome-muted); flex: 0 0 auto; }
  .tchip .cdot.ok { background: var(--chrome-ok); } .tchip .cdot.bad { background: var(--chrome-err); } .tchip .cdot.on { background: var(--chrome-ok); animation: pulse 1.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .tchip .cdot.on { animation: none; } }
  .jump { position: relative; flex: 0 1 360px; min-width: 160px; margin-left: 12px; }
  .jump input { width: 100%; height: 36px; padding: 0 64px 0 34px; border-radius: var(--radius-md); border: 1px solid color-mix(in srgb, var(--fg-on-chrome) 22%, transparent); background: color-mix(in srgb, var(--fg-on-chrome) 6%, transparent); color: var(--fg-on-chrome); font: 14px var(--font-sans); }
  .jump input::placeholder { color: var(--fg-on-chrome-muted); }
  .jump input:focus-visible { outline: 2px solid var(--focus-chrome); outline-offset: 0; }
  .jump > svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-on-chrome-muted); pointer-events: none; }
  .jump kbd.jk { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; color: var(--fg-on-chrome-muted); border-color: color-mix(in srgb, var(--fg-on-chrome) 25%, transparent); }
  .jump-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 40; list-style: none; margin: 0; padding: 4px; max-height: 60vh; overflow-y: auto; background: var(--bg-surface); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); }
  .jump-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; }
  .jump-list li[aria-selected="true"] { background: var(--accent-tint); }
  .jump-list .k { font: 12.5px var(--font-mono); }
  .jump-list .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jump-list .w { font-size: 12px; color: var(--fg-muted); }
  .jump-list li.none { display: block; color: var(--fg-muted); cursor: default; }

  .runpanel { position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); width: 44px; border-left: 1px solid var(--border); background: var(--bg-surface); display: flex; flex-direction: column; z-index: 20; }
  .runpanel.open { width: 380px; }
  .runpanel .strip { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0; height: 100%; }
  .runpanel .vlabel { writing-mode: vertical-rl; font-size: 12.5px; font-weight: 600; color: var(--fg-muted); letter-spacing: .02em; }
  .icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-surface); color: var(--fg); cursor: pointer; }
  .icon-btn:hover { background: var(--bg-sunken); }
  .rp-head { display: flex; gap: 10px; align-items: flex-start; padding: 16px 16px 12px; border-bottom: 1px solid var(--border-subtle); }
  .rp-head h2 { margin: 2px 0 2px; font-size: 18px; line-height: 1.25; }
  .rk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--border-subtle); }
  .rk > div { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-right: 1px solid var(--border-subtle); min-width: 0; }
  .rk > div:last-child { border-right: 0; }
  .rk span { font-size: 11.5px; color: var(--fg-muted); }
  .rk b { font: var(--display-weight) 17px/1.2 var(--font-display); overflow-wrap: anywhere; }
  .rp-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .indet { height: 3px; background: var(--bg-sunken); overflow: hidden; position: relative; }
  .indet::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; background: var(--accent); animation: indet 1.4s ease-in-out infinite; }
  @keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .indet::after { animation: none; width: 100%; opacity: .4; } }
  .feed2 { display: flex; flex-direction: column; }
  .feed2 .ev { display: grid; grid-template-columns: 58px 52px minmax(0, 1fr); gap: 8px; align-items: start; padding: 7px 0; border-bottom: 1px solid var(--border-subtle); font-size: 13px; }
  .feed2 .t { font: 11.5px/1.7 var(--font-mono); color: var(--fg-muted); }
  .feed2 .path { display: block; font: 12px var(--font-mono); color: var(--fg-muted); overflow-wrap: anywhere; }
  .tag { display: inline-block; text-align: center; font: 700 10.5px/1.6 var(--font-mono); letter-spacing: .04em; padding: 0 5px; border-radius: var(--radius-sm); background: var(--neutral-bg); color: var(--neutral-fg); }
  .tag.write, .tag.edit { background: var(--info-bg); color: var(--info-fg); }
  .tag.agent { background: var(--accent-tint); color: var(--accent-tint-fg); }
  .tag.snap { background: var(--agent-bg); color: var(--agent-fg); border: 1px solid var(--border); }
  .tag.done { background: var(--ok-bg); color: var(--ok-fg); } .tag.fail { background: var(--err-bg); color: var(--err-fg); } .tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
  details.fold2 > summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
  .dsteps { display: flex; flex-direction: column; gap: 6px; padding: 6px 0 0; font-size: 13.5px; }
  .dstep { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
  .dstep .m { font: 12px var(--font-mono); color: var(--fg-muted); white-space: nowrap; }

  /* AIQA's type and controls. */
  .eyebrow { display: block; font: 700 11.5px/1.4 var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); }
  main > h1:not(.mono)::after, .page-head > h1::after { content: ""; display: block; width: 40px; height: 4px; margin-top: 10px; border-radius: 2px; background: var(--accent); }
  .run-live .grow { flex: 1 1 220px; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: var(--radius-md); background: var(--bg-sunken); border: 1px solid var(--border-subtle); }
  .seg button { font: 600 13.5px var(--font-sans); min-height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--fg-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg-surface); color: var(--fg); border-color: var(--border); box-shadow: var(--shadow-sm); }
  .seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .msg { border-radius: var(--radius-md); padding: 10px 14px; font-size: 14px; border: 1px solid transparent; }
  .msg.info { background: var(--info-bg); color: var(--info-fg); border-color: color-mix(in srgb, var(--info-fg) 25%, transparent); }
  .msg.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: color-mix(in srgb, var(--warn-fg) 25%, transparent); }
  .msg.bad { background: var(--err-bg); color: var(--err-fg); border-color: color-mix(in srgb, var(--err-fg) 25%, transparent); }
  .msg p { margin: 0; } .msg p + p, .msg p + .actions { margin-top: 8px; }

  /* The story list pane (left of a story, as in AIQA): filters, a status and an M · A bar per story. */
  .sp-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); }
  .sp-chips button { font: 600 12.5px var(--font-sans); min-height: 28px; padding: 0 10px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--bg-surface); color: var(--fg); cursor: pointer; }
  .sp-chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg-surface); border-color: var(--fg); }
  .sp-item .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .sp-item .cov { display: flex; gap: 8px; align-items: center; font: 11.5px var(--font-mono); color: var(--fg-muted); }
  .mabar { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-sunken); border: 1px solid var(--border-subtle); overflow: hidden; }
  .mabar i { display: block; height: 100%; background: var(--accent); }
  .story-page.pane-closed { grid-template-columns: 44px minmax(0, 1fr); }
  .story-page.pane-closed .story-side { display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 10px; }
  .status-line { font-size: 14px; color: var(--fg-2); margin: 2px 0 0; }
  .status-line .err-text { font-weight: 600; }

  /* Screenshot lightbox. */
  .lightbox { position: fixed; inset: 0; z-index: 60; background: var(--scrim-strong); display: grid; place-items: center; padding: 24px; }
  .lightbox[hidden], .jump-list[hidden], .runpanel[hidden] { display: none; }
  .lightbox img { max-width: min(1200px, 100%); max-height: calc(100vh - 120px); border-radius: var(--radius-md); background: var(--bg-surface); }
  .lbbar { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 12px; color: var(--on-scrim); font-size: 14px; flex-wrap: wrap; }
  .lbbar button { font: 600 13.5px var(--font-sans); min-height: 34px; padding: 0 14px; border-radius: var(--radius-md); border: 1px solid color-mix(in srgb, var(--on-scrim) 40%, transparent); background: transparent; color: var(--on-scrim); cursor: pointer; }
  .lbbar button:disabled { opacity: .4; cursor: default; }

  @media (max-width: 1100px) {
    .runpanel.open { position: fixed; right: 0; top: var(--topbar-h); bottom: 0; height: auto; width: min(400px, 100vw); box-shadow: var(--shadow-lg); }
    .shell { grid-template-columns: var(--rail-w) minmax(0, 1fr) 44px; }
    .pills .tchip.opt { display: none; }
  }
  @media (max-width: 860px) { .jump { display: none; } }
  .rail { background: var(--bg-rail); display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); }
  .rail a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: var(--radius-md); color: var(--fg-on-chrome-muted); text-decoration: none; font-size: 11.5px; font-weight: 600; text-align: center; }
  .rail a:hover { color: var(--fg-on-chrome); background: var(--bg-rail-active); }
  .rail a[aria-current="page"] { background: var(--bg-rail-active); color: var(--fg-on-chrome); }
  .rail a:focus-visible { outline-color: var(--focus-chrome); }
  main { padding: 24px clamp(16px, 3vw, 32px) 48px; max-width: 1320px; width: 100%; outline: none; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; font-weight: var(--display-weight); }
  h2 { font-size: 17px; margin: 28px 0 10px; font-weight: var(--display-weight); }
  .sub { color: var(--fg-muted); margin: 0 0 18px; }
  .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  .pad { padding: 16px 18px; }
  .steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .step { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  .step .num { font: 600 12px var(--font-mono); color: var(--fg-muted); }
  .step .name { font-weight: 600; }
  .step .role { font-size: 13px; color: var(--fg-muted); flex: 1; }
  .step .meta { font-size: 12.5px; color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .step.running { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: var(--radius-pill); background: var(--neutral-bg); color: var(--neutral-fg); white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .chip.err { background: var(--err-bg); color: var(--err-fg); }
  .chip.info { background: var(--info-bg); color: var(--info-fg); }
  .chip.agent { background: var(--agent-bg); color: var(--agent-fg); }
  .chip.accent { background: var(--accent); color: var(--accent-fg); }
  .chip.line { background: transparent; color: var(--fg-2); border: 1px solid var(--fg-muted); padding: 1px 8px; }
  .chip.running::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .chip.running::before { animation: none; } }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; margin: 0 0 18px; }
  .kv span { color: var(--fg-muted); }
  .kv b { color: var(--fg); font-weight: 600; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
  .stat { padding: 12px 16px; }
  .stat .v { font: var(--display-weight) 28px/1.15 var(--font-display); }
  .stat .l { font-size: 13px; color: var(--fg-muted); }
  .stat.ok .v { color: var(--ok-solid); } .stat.err .v { color: var(--err-solid); } .stat.warn .v { color: var(--warn-solid); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 12px; align-items: center; padding: var(--row-pad-y) 16px; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
  .list li:first-child { border-top: 0; }
  .list a { font-weight: 600; text-decoration: none; }
  .list a:hover { text-decoration: underline; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--fg-muted); }
  .small { font-size: 13px; }
  .mono { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-surface); margin: 0 0 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-top: 1px solid var(--border-subtle); }
  th { background: var(--bg-sunken); font-weight: 600; border-top: 0; white-space: nowrap; }
  td.id { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  .doc { line-height: 1.6; overflow-wrap: anywhere; }
  .doc h1 { font-size: 24px; margin: 8px 0 12px; } .doc h2 { font-size: 19px; margin: 26px 0 8px; } .doc h3 { font-size: 16px; margin: 20px 0 6px; }
  .doc pre { background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; overflow: auto; font: 13px/1.5 var(--font-mono); }
  .doc code { font-family: var(--font-mono); font-size: .92em; background: var(--bg-sunken); padding: 1px 4px; border-radius: 4px; }
  .doc pre code { background: none; padding: 0; }
  .doc blockquote { margin: 0 0 12px; padding: 2px 14px; border-left: 3px solid var(--border); color: var(--fg-2); }
  .doc .table-wrap table { font-size: 13px; }
  pre.text { margin: 0; padding: 14px 16px; overflow: auto; font: 13px/1.5 var(--font-mono); background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); white-space: pre; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0 14px; }
  .tabs a { padding: 6px 12px; border-radius: var(--radius-pill); border: 1px solid var(--border); text-decoration: none; color: var(--fg); font-size: 13.5px; font-weight: 600; background: var(--bg-surface); }
  .tabs a[aria-current="true"] { background: var(--fg); color: var(--bg-surface); border-color: transparent; }
  .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--bg-sunken); min-width: 80px; }
  .bar span { display: block; height: 100%; }
  .empty { padding: 32px 20px; text-align: center; color: var(--fg-muted); }
  .empty code, .hint code { font-family: var(--font-mono); background: var(--bg-sunken); padding: 1px 6px; border-radius: 4px; color: var(--fg); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .back { display: inline-block; margin-bottom: 10px; font-size: 14px; }
  .gate { background: var(--gate-bg); color: var(--gate-fg); border: 1px solid var(--gate-border); border-radius: var(--radius-lg); padding: 12px 16px; margin: 0 0 16px; }
  .gate code { font-family: var(--font-mono); }
  .err-box { background: var(--err-bg); color: var(--err-fg); border-radius: var(--radius-md); padding: 10px 14px; }
  .failure { padding: 10px 16px; border-top: 1px solid var(--border-subtle); }
  .failure:first-child { border-top: 0; }
  .failure .e { font: 12.5px/1.45 var(--font-mono); color: var(--err-solid); overflow-wrap: anywhere; }
  .story-row .bar { width: 140px; }
  select { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 6px 10px; min-height: 36px; max-width: 100%; }
  select:disabled { opacity: .7; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid transparent; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: var(--bg-surface); color: var(--fg); border-color: var(--border); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 0; }
  .ok-box { background: var(--ok-bg); color: var(--ok-fg); border-radius: var(--radius-md); padding: 8px 12px; }
  .models td { vertical-align: middle; }
  .models label { font-weight: 600; }
  .rail .rail-end { margin-top: auto; }
  .settings { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 28px; align-items: start; }
  .settings fieldset { border: 0; margin: 0 0 24px; padding: 0; min-width: 0; }
  .settings legend { padding: 0 0 10px; font: var(--display-weight) 17px/1.3 var(--font-display); }
  .theme-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .theme-card { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-surface); cursor: pointer; }
  .theme-card:has(input:checked) { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
  .theme-card:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .theme-card .head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .theme-card input, .choice input { margin: 0; width: 16px; height: 16px; accent-color: var(--focus); flex: 0 0 auto; }
  .theme-card .desc { font-size: 13px; color: var(--fg-muted); line-height: 1.4; }
  .swatch { display: flex; flex-direction: column; height: 64px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .swatch .sw-top { height: 14px; display: flex; align-items: center; padding: 0 6px; }
  .swatch .sw-top i { display: block; width: 22px; height: 6px; border-radius: 1px; }
  .swatch .sw-body { flex: 1; display: flex; align-items: flex-end; justify-content: space-between; padding: 7px; }
  .swatch .sw-dots { display: flex; gap: 4px; }

<script>
(function () {
  "use strict";
  var STATIC = window.__AGENTIC_QA_STATIC__ || null;
  var main = document.getElementById("main");
  var state = null, lastJson = "", route = parseRoute();

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function api(p) {
    if (STATIC) return Promise.resolve().then(function () { if (p in STATIC) return STATIC[p]; throw new Error("This part isn't in the saved snapshot. Open the live dashboard to see it."); });
    return fetch(p, { cache: "no-store" }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || r.statusText); return j; });
    });
  }
  function docKey(p) { return "api/doc?path=" + encodeURIComponent(p); }
  function parseRoute() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!h) return { v: "now" };
    var i = h.indexOf("/");
    return i < 0 ? { v: h } : { v: h.slice(0, i), arg: h.slice(i + 1) };
  }
  function fmtDur(ms) {
    if (ms == null || isNaN(ms)) return "";
    var s = Math.round(ms / 1000);
    return s >= 3600 ? Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m" : s >= 60 ? Math.floor(s / 60) + "m " + (s % 60) + "s" : s + "s";
  }
  function fmtTime(iso) { if (!iso) return ""; var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
  function fmtSize(n) { return n == null ? "" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
  function docLink(p, label) { return '<a href="#doc/' + encodeURIComponent(p) + '">' + esc(label || p.split("/").pop()) + "</a>"; }
  function rawHref(p) { return STATIC ? "../../" + p.split("/").map(encodeURIComponent).join("/") : "raw/" + p.split("/").map(encodeURIComponent).join("/"); }

  var STEP_CHIP = {
    done: ["ok", "Done"], running: ["neutral running", "Running"], failed: ["err", "Failed"], skipped: ["neutral", "Skipped"],
    paused: ["accent", "Waiting for you"], pending: ["neutral", "Not started"], notNeeded: ["neutral", "Not needed"], next: ["neutral", "Next"], review: ["accent", "Your turn: review"]
  };
  function chip(kind) { var c = STEP_CHIP[kind] || ["neutral", kind]; return '<span class="chip ' + c[0] + '">' + esc(c[1]) + "</span>"; }

  // Green, orange and red mean test status; the accent means "your turn"; everything else is neutral.
  var STATUS_TONE = { Draft: "neutral", Verified: "ok", Updated: "line", New: "neutral", Blocked: "warn", "Possible defect": "err", Existing: "line", Outdated: "warn", Obsolete: "neutral" };
  var STATUS_COLOR = { Draft: "var(--border)", Verified: "var(--ok-solid)", Updated: "var(--fg-2)", New: "var(--series-3)", Blocked: "var(--warn-solid)", "Possible defect": "var(--err-solid)", Existing: "var(--fg-2)", Outdated: "var(--warn-solid)", Obsolete: "var(--fg-muted)" };
  function statusChip(s) { return '<span class="chip ' + (STATUS_TONE[s] || "neutral") + '">' + esc(s || "—") + "</span>"; }
  function countsBar(counts, total) {
    if (!total) return '<div class="bar" aria-hidden="true"></div>';
    var parts = Object.keys(counts).map(function (k) { return '<span style="width:' + (100 * counts[k] / total) + "%;background:" + (STATUS_COLOR[k] || "var(--fg-muted)") + '" title="' + esc(k + ": " + counts[k]) + '"></span>'; });
    var label = Object.keys(counts).map(function (k) { return counts[k] + " " + k; }).join(", ");
    return '<div class="bar" role="img" aria-label="' + esc(label) + '">' + parts.join("") + "</div>";
  }
  function emptyBox(html) { return '<div class="card empty">' + html + "</div>"; }

  /** Relative links in a rendered document point at files next to it: .md opens in the viewer, the rest raw. */
  function fixLinks(rootEl, baseFile) {
    var dir = (baseFile || "").split("/").slice(0, -1);
    rootEl.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href");
      if (/^https?:/i.test(h)) { a.target = "_blank"; a.rel = "noopener noreferrer"; return; }
      if (/^(#|mailto:)/i.test(h)) return;
      var parts = dir.slice();
      h.split("#")[0].split("/").forEach(function (seg) { if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg); });
      var p = parts.join("/");
      if (/\.md$/i.test(p)) a.href = "#doc/" + encodeURIComponent(p);
      else { a.href = rawHref(p); a.target = "_blank"; a.rel = "noopener"; }
    });
  }

  // ── Shared pieces ────────────────────────────────────────────────────────
  var STORY_STEP_NAME = { "story-pull": "Pull", "story-design": "Design", "story-explore": "Explore", "story-script": "Automate", "story-run": "Run" };
  var SUITE_DOING = { analyst: "The Analyst is exploring the app", "qa-planner": "The QA Planner is writing the test plan", "qa-engineer": "The QA Engineer is writing the test cases and specs", "qa-reviewer": "The QA Reviewer is checking the selectors", "qa-reporter": "The QA Reporter is running the tests" };
  var NUM = ["no", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many || one + "s"); }
  function count(n, one, many) { return (n < 10 ? NUM[n] : n) + " " + (n === 1 ? one : many || one + "s"); }
  function cmdBox(cmd) { return '<span class="cmd"><code>' + esc(cmd) + '</code><button class="btn ghost sm" type="button" data-copy="' + esc(cmd) + '">Copy</button></span>'; }
  function clock(iso) { if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return ""; var t = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + ", " + t; }
  function suiteDocLink(p, label) { return '<a href="#suite/' + encodeURIComponent(p) + '">' + esc(label || p.split("/").pop()) + "</a>"; }
  function stepById(id) { return state.suite.steps.filter(function (x) { return x.id === id; })[0]; }
  function isWaitingStory(s) { return !!(s.review && s.next && !s.running); }
  function defectCount(s) { return (s.counts && s.counts["Possible defect"]) || 0; }

  // ── Running agents from the page ─────────────────────────────────────────
  // state.control comes from the live server only: { available: the claude CLI is there, job: what the page started }.
  function control() { return (!STATIC && state && state.control) || null; }
  function canStart() { var c = control(); return !!(c && c.available && !c.job && (!c.ai || c.ai.ready)); }
  function busyText() {
    var c = control();
    if (!c) return "";
    if (!c.available) return "Starting agents from here needs the Claude Code CLI (claude) or the GitHub Copilot CLI (copilot) on this computer.";
    if (c.job) return c.job.label + " is running.";
    return c.ai && !c.ai.ready ? c.ai.why : "";
  }
  // ── The AI a run uses (checked before it starts) and the models for this run ──
  var ROLES_ALL = ["analyst", "qa-planner", "qa-engineer", "qa-reviewer", "qa-reporter"];
  var ROLE_NAME = { analyst: "Analyst", "qa-planner": "QA Planner", "qa-engineer": "QA Engineer", "qa-reviewer": "QA Reviewer", "qa-reporter": "QA Reporter" };
  /** "Runs on Claude Code · Claude Pro", or why the AI can't run the agents yet. */
  function aiLine() {
    var c = control(), a = c && c.ai;
    if (!c) return "";
    if (!a) return '<p class="ai-line muted small">Checking which AI this computer has\u2026</p>';
    var q = a.quota && a.quota.chat != null && a.quota.chat !== "unlimited" ? " · " + a.quota.chat + " chat requests left" : "";
    return a.ready
      ? '<p class="ai-line small"><span class="chip ok">Ready</span> Runs on <b>' + esc(a.label) + "</b> · " + esc(a.plan || "") + esc(q) + ' · <a href="#settings/ai">Change</a></p>'
      : '<div class="msg warn ai-line"><p><b>The AI isn\u2019t ready.</b> ' + esc(a.why) + '</p><p><a href="#settings/ai">Open Settings \u2192 AI</a></p></div>';
  }
  /** Selects for this run's model per role, pre-filled with the saved defaults (Settings → AI). */
  function runModelsPicker(id, roles, picked) {
    var a = control() && control().ai;
    if (!a || !roles.length) return "";
    var label = function (m) { return MODEL_LABEL[m] || m; };
    var sameDefault = a.provider === "anthropic" ? "the session\u2019s model" : "Copilot\u2019s default";
    var changed = picked && Object.keys(picked).length;
    return '<details class="run-models" id="' + id + '"' + (changed ? " open" : "") + '><summary>Models for this run <span class="muted small">' + esc(roles.map(function (r) { var m = (picked && picked[r]) || a.defaults[r]; return ROLE_NAME[r] + " " + (m ? label(m) : "default"); }).join(" · ")) + '</span></summary><div class="rm-grid">' + roles.map(function (r) {
      var d = a.defaults[r], cur = (picked && picked[r]) || "";
      return '<label class="fld"><span class="field-label">' + esc(ROLE_NAME[r]) + '</span><select data-role="' + esc(r) + '"><option value="">Saved: ' + esc(d ? label(d) : sameDefault) + "</option>" + a.options.map(function (o) { return '<option value="' + esc(o) + '"' + (o === cur ? " selected" : "") + ">" + esc(label(o)) + "</option>"; }).join("") + "</select></label>";
    }).join("") + '</div><p class="muted small" style="margin:6px 0 0">For this run only. Change the saved ones in <a href="#settings/ai">Settings \u2192 AI</a>.</p></details>';
  }
  function pickedModels(root) {
    var out = {};
    root.querySelectorAll(".run-models select[data-role]").forEach(function (sel) { if (sel.value) out[sel.getAttribute("data-role")] = sel.value; });
    return out;
  }
  /** The roles a story's next steps use: Design = QA Planner, Explore = Analyst, Automate = QA Engineer. */
  function storyRoles(next) {
    var order = ["story-design", "story-explore", "story-script"], role = { "story-design": "qa-planner", "story-explore": "analyst", "story-script": "qa-engineer" };
    var i = order.indexOf(next);
    return i < 0 ? [] : order.slice(i).map(function (x) { return role[x]; });
  }

  function stepName(id) { var x = stepById(id); return x ? x.name : id; }
  function since(iso) { return '<span data-since="' + esc(iso) + '">' + esc(fmtDur(Date.now() - Date.parse(iso))) + "</span>"; }
  function runBtn(attrs, label, cls) { return '<button type="button" class="' + (cls || "btn") + '" ' + attrs + (canStart() ? "" : ' disabled title="' + esc(busyText() || "Not available") + '"') + ">" + esc(label) + "</button>"; }

  var startDraft = null;
  /** The form that starts a full-suite run: the app's address, what to test and how. */

  function testName(title) { var last = String(title || "").split(" › ").pop(); return last.replace(/^TC-[A-Za-z0-9]+-[A-Za-z]-\d+\s*[—–:-]\s*/, ""); }

  // ── Now ──────────────────────────────────────────────────────────────────

  // ── Settings: the look, for this browser or as the project default ─────────
  var LS_KEYS = { theme: "agentic-qa-ui-theme", mode: "agentic-qa-ui-mode" };

  ];
  var settingsDraft = null, settingsScope = "browser";
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }

  function known(kind, v) { if (kind === "theme" && v === "slate") v = "geist"; return LOOK[kind][v] ? v : null; }
  function browserLook() {
    var out = {}, any = false;
    Object.keys(LS_KEYS).forEach(function (k) { var v = known(k, lsGet(LS_KEYS[k])); if (v) { out[k] = v; any = true; } });

    else if (route.v === "settings") { var tab = settingsTab(); if (tab === "ai") viewModels(); else if (tab === "project") viewProject(); else if (tab === "connection") viewConnection(); else viewSettings(); }
    else if (route.v === "doc" && route.arg) viewDoc(route.arg);
    else if (route.v === "edit" && route.arg) viewDoc(route.arg, true);
    else viewNow();
    if (scrollTop) window.scrollTo(0, 0);
    refreshLog();
  }

  /** Copy buttons next to commands: the command goes to the clipboard, and the button says so for a moment. */
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-copy]");
    if (!b) return;
    var text = b.getAttribute("data-copy");
    var done = function (ok) { b.textContent = ok ? "Copied" : "Select and copy"; setTimeout(function () { b.textContent = "Copy"; }, 1600); };
    if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    else {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      document.body.removeChild(ta); done(ok);
    }
  });

  // ── The run buttons ──────────────────────────────────────────────────────
  function toast(text, ok) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var t = document.createElement("div");
    t.className = "toast " + (ok ? "ok-box" : "err-box");
    t.setAttribute("role", ok ? "status" : "alert");
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function () { if (t.isConnected) t.remove(); }, 9000);
  }
  /** The state as compared between polls: without its time, or the running job's live counts. */
  function stateKey(s) {
    var c = s.control && s.control.job ? Object.assign({}, s.control, { job: Object.assign({}, s.control.job, { live: null }) }) : s.control;
    return JSON.stringify(Object.assign({}, s, { generatedAt: "", control: c }));
  }
  function takeState(s) {
    state = s;
    lastJson = stateKey(s);
    render(false);
  }
  /** POST api/run/<action>; the reply is the new state, so the page shows the step running at once. */
  function runAction(action, body, btn, busyLabel) {
    var label = btn ? btn.textContent : "";
    if (btn) { btn.disabled = true; btn.textContent = busyLabel || "Starting…"; }
    return fetch("api/run/" + action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || r.statusText); return j; }); })
      .then(function (s) { takeState(s); if (action !== "stop" && action !== "finish") setPanel(true); return true; })
      .catch(function (err) { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } toast(err.message || String(err)); return false; });
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-run]");
    if (!b || b.disabled || STATIC) return;
    var kind = b.getAttribute("data-run");
    if (kind === "step") runAction("step", { step: b.getAttribute("data-step") }, b);
    else if (kind === "stop") {
      var job = control() && control().job;
      if (window.confirm(job ? "Stop " + job.label + "? What it wrote so far stays." : "Mark the running step as stopped? Only do this when the session running it has ended.")) runAction("stop", {}, b, "Stopping…");
    } else if (kind === "finish") {
      if (window.confirm("End this run without running its remaining steps?")) runAction("finish", {}, b, "Ending…");
    } else if (kind === "story") {
      var u = document.getElementById("storyUrl");
      if (u && u.value.trim() && !/^https?:\/\/\S+$/i.test(u.value.trim())) { u.focus(); return toast("Enter the app's address, starting with http:// or https://."); }
      var sm = document.getElementById("storyModels");
      runAction("story", { key: b.getAttribute("data-key"), url: u ? u.value.trim() : "", models: sm ? pickedModels(sm.parentNode) : {} }, b);
    }
  });
  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "startForm") return;
    e.preventDefault();
    var form = e.target, d = readStartForm(form), url = form.elements.url;
    if (!/^https?:\/\/\S+$/i.test(d.url)) { url.focus(); return toast("Enter the app's address, starting with http:// or https://."); }
    startDraft = d;
    runAction("start", d, form.querySelector("#sf-go")).then(function (ok) {
      if (!ok) return;
      startDraft = null;
      if (parseRoute().v !== "suite") location.hash = "#suite";
    });
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t && t.id === "storyUrl") storyUrl = t.value;
    var form = t && t.closest && t.closest("#startForm");
    if (form) startDraft = readStartForm(form);
  });
  document.addEventListener("change", function (e) {
    var form = e.target && e.target.closest && e.target.closest("#startForm");
    if (form) startDraft = readStartForm(form);
  });
  /** While someone types in a field on the page, a poll doesn't redraw it; it redraws when they leave the field. */
  var renderPending = false;
  function typing() {
    var a = document.activeElement;
    return !!(a && main.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== "radio" && a.type !== "checkbox");
  }
  main.addEventListener("focusout", function () {
    setTimeout(function () { if (renderPending && !typing() && !editing()) { renderPending = false; render(false); } }, 0);
  });
  function tick() {
    document.querySelectorAll("[data-since]").forEach(function (el) { el.textContent = fmtDur(Date.now() - Date.parse(el.getAttribute("data-since"))); });
    refreshLog();
  }

  function setLive(kind, text) {
    var el = document.getElementById("live");
    el.className = "live" + (kind ? " " + kind : "");
    document.getElementById("liveText").textContent = text;
  }

  function poll() {
    api("api/state").then(function (s) {
      var json = stateKey(s);
      state = s;
      if (STATIC) setLive("snapshot", "Snapshot · " + fmtTime(s.generatedAt));
      else setLive("", "Live · " + new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
      // Re-render only when something changed, and leave documents and the Models form alone while they're in use.
      if (json !== lastJson) {
        var first = !lastJson;
        lastJson = json;
        if (first || (route.v !== "doc" && route.v !== "models" && route.v !== "settings")) {
          if (!first && (typing() || editing())) renderPending = true;
          else render(false);
        }
      }
      tick();
      renderHeader();
      fetchFeed();
      if (!panelOpen()) renderPanel();
    }).catch(function () { setLive("stale", "Disconnected — is the dashboard still running?"); });
  }

  // Moving within a page (another document in the suite reader, another case of the same story) keeps the scroll position.
  var lastRoute = parseRoute();
  var lastHash = location.hash;
  window.addEventListener("hashchange", function () {
    // Leaving an edit with unsaved changes asks first; staying puts the address back.
    if (unsaved() && !window.confirm("You have unsaved changes. Leave without saving them?")) { history.replaceState(null, "", lastHash || "#"); return; }
    fileEdit = null;
    caseEdit = null;
    lastHash = location.hash;
    var r = parseRoute(), key = function (x) { return x.v === "story" ? "story/" + (x.arg || "").split("/")[0] : x.v; };
    var samePage = key(r) === key(lastRoute) && (r.v === "suite" || r.v === "story");
    lastRoute = r;
    render(!samePage);
    if (!samePage) main.focus({ preventScroll: true });
  });
  poll();
  if (!STATIC) setInterval(poll, 2000);
})();
</script>
</body>
</html>
