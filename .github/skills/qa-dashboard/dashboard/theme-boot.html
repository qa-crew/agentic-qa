<script>(function(){try{var d=document.documentElement,s=window.localStorage;var old=s.getItem("aiqa-theme");if(old==="light"||old==="dark"){if(!s.getItem("aiqa-ui-mode"))s.setItem("aiqa-ui-mode",old);s.removeItem("aiqa-theme");}var t=s.getItem("aiqa-ui-theme"),m=s.getItem("aiqa-ui-mode"),n=s.getItem("aiqa-ui-density");if(t==="slate"||t==="industrial")d.setAttribute("data-theme",t);if(m==="light"||m==="dark")d.setAttribute("data-mode",m);else if(m==="system")d.removeAttribute("data-mode");if(n==="compact")d.setAttribute("data-density","compact");else if(n==="comfortable")d.removeAttribute("data-density");}catch(e){}})();</script>
