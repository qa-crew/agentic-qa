<!doctype html>
<html lang="en" data-theme="geist">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic QA Dashboard</title>
<!--THEME_BOOT-->
<style>/*THEME_CSS*/</style>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 var(--font-sans); }
  a { color: var(--link); }
  .top { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg-chrome); color: var(--fg-on-chrome); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
  .logo { background: var(--logo-bg); color: var(--logo-fg); font: var(--display-weight) 15px/1 var(--font-display); letter-spacing: .06em; padding: 7px 9px; border-radius: var(--radius-sm); }
  .proj { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-on-chrome-muted); white-space: nowrap; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chrome-ok); }
  .live.stale .dot { background: var(--chrome-warn); }
  .live.snapshot .dot { background: var(--fg-on-chrome-muted); }
  .shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); }
  .rail { background: var(--bg-rail); display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); }
  .rail a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: var(--radius-md); color: var(--fg-on-chrome-muted); text-decoration: none; font-size: 11.5px; font-weight: 600; text-align: center; }
  .rail a:hover { color: var(--fg-on-chrome); background: var(--bg-rail-active); }
  .rail a[aria-current="page"] { background: var(--bg-rail-active); color: var(--fg-on-chrome); }
  .rail a:focus-visible { outline-color: var(--focus-chrome); }
  main { padding: 24px clamp(16px, 3vw, 32px) 48px; max-width: 1320px; width: 100%; outline: none; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; font-weight: var(--display-weight); }
  h2 { font-size: 17px; margin: 28px 0 10px; font-weight: var(--display-weight); }
  .sub { color: var(--fg-muted); margin: 0 0 18px; }
  .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  .pad { padding: 16px 18px; }
  .steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .step { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  .step .num { font: 600 12px var(--font-mono); color: var(--fg-muted); }
  .step .name { font-weight: 600; }
  .step .role { font-size: 13px; color: var(--fg-muted); flex: 1; }
  .step .meta { font-size: 12.5px; color: var(--fg-muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .step.running { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: var(--radius-pill); background: var(--neutral-bg); color: var(--neutral-fg); white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .chip.err { background: var(--err-bg); color: var(--err-fg); }
  .chip.info { background: var(--info-bg); color: var(--info-fg); }
  .chip.agent { background: var(--agent-bg); color: var(--agent-fg); }
  .chip.accent { background: var(--accent); color: var(--accent-fg); }
  .chip.line { background: transparent; color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--fg-muted); }
  .chip.running::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .chip.running::before { animation: none; } }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; margin: 0 0 18px; }
  .kv span { color: var(--fg-muted); }
  .kv b { color: var(--fg); font-weight: 600; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
  .stat { padding: 12px 16px; }
  .stat .v { font: var(--display-weight) 28px/1.15 var(--font-display); }
  .stat .l { font-size: 13px; color: var(--fg-muted); }
  .stat.ok .v { color: var(--ok-solid); } .stat.err .v { color: var(--err-solid); } .stat.warn .v { color: var(--warn-solid); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 12px; align-items: center; padding: var(--row-pad-y) 16px; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
  .list li:first-child { border-top: 0; }
  .list a { font-weight: 600; text-decoration: none; }
  .list a:hover { text-decoration: underline; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--fg-muted); }
  .small { font-size: 13px; }
  .mono { font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-surface); margin: 0 0 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-top: 1px solid var(--border-subtle); }
  th { background: var(--bg-sunken); font-weight: 600; border-top: 0; white-space: nowrap; }
  td.id { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  .doc { line-height: 1.6; overflow-wrap: anywhere; }
  .doc h1 { font-size: 24px; margin: 8px 0 12px; } .doc h2 { font-size: 19px; margin: 26px 0 8px; } .doc h3 { font-size: 16px; margin: 20px 0 6px; }
  .doc pre { background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; overflow: auto; font: 13px/1.5 var(--font-mono); }
  .doc code { font-family: var(--font-mono); font-size: .92em; background: var(--bg-sunken); padding: 1px 4px; border-radius: 4px; }
  .doc pre code { background: none; padding: 0; }
  .doc blockquote { margin: 0 0 12px; padding: 2px 14px; border-left: 3px solid var(--border); color: var(--fg-2); }
  .doc .table-wrap table { font-size: 13px; }
  pre.text { margin: 0; padding: 14px 16px; overflow: auto; font: 13px/1.5 var(--font-mono); background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); white-space: pre; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0 14px; }
  .tabs a { padding: 6px 12px; border-radius: var(--radius-pill); border: 1px solid var(--border); text-decoration: none; color: var(--fg); font-size: 13.5px; font-weight: 600; background: var(--bg-surface); }
  .tabs a[aria-current="true"] { background: var(--fg); color: var(--bg-surface); border-color: transparent; }
  .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--bg-sunken); min-width: 80px; }
  .bar span { display: block; height: 100%; }
  .empty { padding: 32px 20px; text-align: center; color: var(--fg-muted); }
  .empty code, .hint code { font-family: var(--font-mono); background: var(--bg-sunken); padding: 1px 6px; border-radius: 4px; color: var(--fg); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .back { display: inline-block; margin-bottom: 10px; font-size: 14px; }
  .gate { background: var(--gate-bg); color: var(--gate-fg); border: 1px solid var(--gate-border); border-radius: var(--radius-lg); padding: 12px 16px; margin: 0 0 16px; }
  .gate code { font-family: var(--font-mono); }
  .err-box { background: var(--err-bg); color: var(--err-fg); border-radius: var(--radius-md); padding: 10px 14px; }
  .failure { padding: 10px 16px; border-top: 1px solid var(--border-subtle); }
  .failure:first-child { border-top: 0; }
  .failure .e { font: 12.5px/1.45 var(--font-mono); color: var(--err-solid); overflow-wrap: anywhere; }
  .story-row .bar { width: 140px; }
  select { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 6px 10px; min-height: 36px; max-width: 100%; }
  select:disabled { opacity: .7; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; min-height: 38px; padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid transparent; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: var(--bg-surface); color: var(--fg); border-color: var(--border); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 0; }
  .ok-box { background: var(--ok-bg); color: var(--ok-fg); border-radius: var(--radius-md); padding: 8px 12px; }
  .models td { vertical-align: middle; }
  .models label { font-weight: 600; }
  .m-only { display: none; }
  .rail .rail-end { margin-top: auto; }
  .settings { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 28px; align-items: start; }
  .settings fieldset { border: 0; margin: 0 0 24px; padding: 0; min-width: 0; }
  .settings legend { padding: 0 0 10px; font: var(--display-weight) 17px/1.3 var(--font-display); }
  .theme-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .theme-card { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-surface); cursor: pointer; }
  .theme-card:has(input:checked) { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
  .theme-card:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .theme-card .head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .theme-card input, .choice input { margin: 0; width: 16px; height: 16px; accent-color: var(--focus); flex: 0 0 auto; }
  .theme-card .desc { font-size: 13px; color: var(--fg-muted); line-height: 1.4; }
  .swatch { display: flex; flex-direction: column; height: 64px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .swatch .sw-top { height: 14px; display: flex; align-items: center; padding: 0 6px; }
  .swatch .sw-top i { display: block; width: 22px; height: 6px; border-radius: 1px; }
  .swatch .sw-body { flex: 1; display: flex; align-items: flex-end; justify-content: space-between; padding: 7px; }
  .swatch .sw-dots { display: flex; gap: 4px; }
  .swatch .sw-dots i { display: block; width: 8px; height: 8px; border-radius: 50%; }
  .swatch .sw-btn { font: 600 9px/1 sans-serif; padding: 4px 7px; border-radius: 3px; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-surface); cursor: pointer; font-size: 14px; }
  .choice:has(input:checked) { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
  .choice.block { display: flex; align-items: flex-start; width: 100%; padding: 10px 14px; }
  .choice.block span { display: flex; flex-direction: column; gap: 2px; }
  .choice.block small { color: var(--fg-muted); font-size: 13px; }
  .choice:has(input:disabled) { opacity: .65; cursor: default; }
  .save-box { padding: 18px 20px; }
  .save-box pre { margin: 12px 0 0; padding: 10px 12px; background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font: 12.5px/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .wins ol { margin: 0 0 14px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .wins dl { margin: 0 0 14px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
  .wins dt { color: var(--fg-muted); }
  .wins dd { margin: 0; }
  @media (max-width: 1000px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2, .settings { grid-template-columns: 1fr; } }
  @media (max-width: 720px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail { z-index: 20; height: auto; flex-direction: row; justify-content: space-around; padding: 6px; }
    .rail a { flex: 1 1 0; min-width: 0; flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 2px; }
    .rail .rail-end { margin-top: 0; }
    .steps { grid-template-columns: 1fr; }
    .live #liveText, #themeLabel { display: none; }
    h1 { font-size: 22px; }
    .story-row .bar { width: 100%; }
    .m-only { display: block; margin-top: 2px; }
    .models .d-only, .models thead { display: none; }
    .models table, .models tbody, .models tr, .models td { display: block; width: 100%; }
    .models tr { padding: 10px 14px; border-top: 1px solid var(--border-subtle); }
    .models tr:first-child { border-top: 0; }
    .models td { border: 0; padding: 2px 0; }
    .models select { width: 100%; margin-top: 6px; }
  }
  /* Phase 2 screens: Now, the suite track and reader, story review, failure-first results. */
  .lead { font-size: 17px; max-width: 70ch; margin: 4px 0 18px; color: var(--fg-2); }
  .sect { margin: 0 0 32px; }
  .sect > h2, .sec-head h2 { margin: 0; }
  .sect > h2 { margin-bottom: 12px; }
  .sec-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 0 0 14px; }
  .push { margin-left: auto; }
  .strong-link { font-weight: 600; text-decoration: none; }
  .strong-link:hover { text-decoration: underline; }
  .strong { font-weight: 600; }
  .kt { display: inline-flex; gap: 10px; align-items: baseline; min-width: 0; }
  .kt h3 { margin: 0; }
  .row-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; }
  .plain li { display: flex; gap: 10px; align-items: baseline; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 0 0 22px; font-size: 14px; }
  .facts div { display: flex; gap: 8px; }
  .facts dt { color: var(--fg-muted); }
  .facts dd { margin: 0; }
  .hero { margin: 4px 0 34px; }
  .hero p { margin: 0 0 8px; }
  .hero h1 { font-size: clamp(28px, 3.4vw, 42px); line-height: 1.08; max-width: 26ch; text-wrap: balance; margin: 0; }
  .now-cols { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start; }
  .now-main { flex: 3 1 560px; min-width: 0; }
  .now-side { flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 32px; }
  .side-panel { display: flex; flex-direction: column; gap: 14px; }
  .side-panel h2 { margin: 0; }
  .big-num { margin: 0; font: var(--display-weight) 36px/1.05 var(--font-display); }

  .tl { list-style: none; margin: 0 0 30px; padding: 0; display: flex; gap: 4px; align-items: stretch; }
  .tl .seg { min-width: 120px; display: flex; flex-direction: column; gap: 12px; }
  .tl-bar { display: block; height: 20px; border-radius: 2px; background: var(--bg-sunken); }
  .tl-text { display: flex; flex-direction: column; gap: 2px; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
  .tl-name { display: flex; gap: 8px; align-items: baseline; font-size: 15px; }
  .s-done .tl-bar { background: var(--fg-2); }
  .s-running .tl-bar { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--fg) 22%, transparent) 0 6px, transparent 6px 12px); box-shadow: inset 0 0 0 1.5px var(--fg); }
  .s-paused .tl-bar { background: var(--accent); }
  .s-failed .tl-bar { background: var(--err-solid); }
  .s-skipped .tl-bar { background: transparent; border: 1.5px dashed var(--fg-muted); }
  .s-pending .tl-bar { background: transparent; border: 1.5px solid var(--fg-muted); }
  .s-failed .tl-text > span:nth-child(2) { color: var(--err-fg); font-weight: 600; }

  .mini { display: inline-flex; gap: 3px; flex: 0 0 auto; }
  .mini i { display: block; width: 16px; height: 6px; border-radius: 1px; background: transparent; box-shadow: inset 0 0 0 1px var(--fg-muted); }
  .mini .m-done { background: var(--fg-2); box-shadow: none; }
  .mini .m-turn { background: var(--accent); box-shadow: none; }
  .mini .m-running { background: repeating-linear-gradient(135deg, var(--fg) 0 2px, transparent 2px 4px); }
  .mini .m-failed { background: var(--err-solid); box-shadow: none; }
  .mini .m-skip { box-shadow: none; background: repeating-linear-gradient(90deg, var(--fg-muted) 0 3px, transparent 3px 5px); height: 2px; margin-top: 2px; }
  .prog { display: inline-flex; align-items: center; gap: 10px; }
  .tbl-card { overflow-x: auto; }
  .tbl { width: 100%; font-size: 14px; }
  .tbl th { font-size: 13px; color: var(--fg-muted); background: var(--bg-surface); border-bottom: 1px solid var(--border); }
  .tbl td, .tbl th { padding: var(--row-pad-y) 14px; vertical-align: middle; }
  .tbl td .bar { margin-top: 6px; max-width: 160px; }
  .w-bar { width: 30%; }

  .gate.big { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; margin: 0 0 12px; }
  .gate.big h3 { font-size: 22px; margin: 0; }
  .gate.big p { margin: 0; max-width: 68ch; font-size: 16px; }
  .gate.row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 16px 20px; }
  .gate.row .grow { display: flex; flex-direction: column; gap: 4px; flex: 1 1 360px; }
  .gate-muted { opacity: .82; }
  .gate .btn.gate-btn, .gate-btn { background: var(--gate-btn-bg); color: var(--gate-btn-fg); }
  .gate .cmd code { color: inherit; border-color: color-mix(in srgb, currentColor 35%, transparent); background: transparent; }
  .gate .cmd .btn.ghost { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 45%, transparent); }
  .card.wait { padding: 16px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  .card.wait h3 { font-size: 16px; margin: 0; }
  .card.wait p { margin: 4px 0 0; }
  .actions.tight { margin: 0; gap: 10px; }
  .cmd { display: inline-flex; align-items: stretch; gap: 0; }
  .cmd code { font: 13px/1 var(--font-mono); display: inline-flex; align-items: center; padding: 0 10px; border: 1px solid var(--border); border-right: 0; border-radius: var(--radius-md) 0 0 var(--radius-md); background: var(--bg-sunken); white-space: nowrap; }
  .cmd .btn { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13.5px; }

  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); font-size: 14.5px; }
  .feed li .mono { font-size: 12.5px; padding-top: 2px; }

  .reader { display: flex; flex-wrap: wrap; min-height: 560px; overflow: hidden; }
  .reader-nav { flex: 1 1 260px; max-width: 320px; border-right: 1px solid var(--border); padding: 6px 0 12px; background: var(--bg-surface); }
  .rg-head { padding: 14px 18px 6px; display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
  .reader-nav ul { list-style: none; margin: 0; padding: 0; }
  .reader-nav a { display: flex; justify-content: space-between; gap: 10px; padding: 7px 18px; text-decoration: none; color: var(--fg); font-size: 14px; overflow-wrap: anywhere; }
  .reader-nav a:hover { background: var(--bg-sunken); }
  .reader-nav a[aria-current="true"], .story-side a[aria-current="page"] { background: var(--accent-tint); box-shadow: inset 3px 0 0 var(--accent); color: var(--fg); }
  .reader-body { flex: 999 1 480px; min-width: 0; padding: 24px 30px 32px; }
  .reader-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; border-bottom: 1px solid var(--border-subtle); padding-bottom: 14px; margin-bottom: 16px; }
  .reader-head h3 { font-size: 24px; margin: 0 0 4px; }
  .reader-body .doc { max-width: 860px; }

  .story-page { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; align-items: start; }
  .story-side { position: sticky; top: calc(var(--topbar-h) + 16px); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-surface); overflow: hidden; max-height: calc(100vh - var(--topbar-h) - 40px); overflow-y: auto; }
  .ss-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 10px; border-bottom: 1px solid var(--border-subtle); }
  .story-side nav a { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); text-decoration: none; color: var(--fg); }
  .story-side nav a:hover { background: var(--bg-sunken); }
  .story-side .kt b { font-weight: 600; line-height: 1.3; }
  .story-main .back { display: none; }
  .story-head { display: flex; flex-direction: column; gap: 6px; margin: 0 0 18px; }
  .story-head h1 { font-size: clamp(26px, 2.8vw, 34px); line-height: 1.1; margin: 0; }

  .cd-head { display: flex; flex-direction: column; gap: 10px; }

<body>
<header class="top">

</header>
<div class="shell">
  <nav class="rail" aria-label="Views">
    <a href="#now" data-view="now"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now</a>

    <a href="#results" data-view="results"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Results</a>
    <a href="#models" data-view="models"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Models</a>

  </nav>
  <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
</div>
<!--STATIC_DATA-->
<script>
(function () {
  "use strict";
  var STATIC = window.__AGENTIC_QA_STATIC__ || null;
  var main = document.getElementById("main");
  var state = null, lastJson = "", route = parseRoute();

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function api(p) {
    if (STATIC) return Promise.resolve().then(function () { if (p in STATIC) return STATIC[p]; throw new Error("This part isn't in the saved snapshot. Open the live dashboard to see it."); });
    return fetch(p, { cache: "no-store" }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || r.statusText); return j; });
    });
  }
  function docKey(p) { return "api/doc?path=" + encodeURIComponent(p); }
  function parseRoute() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!h) return { v: "now" };
    var i = h.indexOf("/");
    return i < 0 ? { v: h } : { v: h.slice(0, i), arg: h.slice(i + 1) };
  }
  function fmtDur(ms) {
    if (ms == null || isNaN(ms)) return "";
    var s = Math.round(ms / 1000);
    return s >= 3600 ? Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m" : s >= 60 ? Math.floor(s / 60) + "m " + (s % 60) + "s" : s + "s";
  }
  function fmtTime(iso) { if (!iso) return ""; var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
  function fmtSize(n) { return n == null ? "" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB"; }
  function docLink(p, label) { return '<a href="#doc/' + encodeURIComponent(p) + '">' + esc(label || p.split("/").pop()) + "</a>"; }
  function rawHref(p) { return STATIC ? "../../" + p.split("/").map(encodeURIComponent).join("/") : "raw/" + p.split("/").map(encodeURIComponent).join("/"); }

  var STEP_CHIP = {
    done: ["ok", "Done"], running: ["neutral running", "Running"], failed: ["err", "Failed"], skipped: ["neutral", "Skipped"],
    paused: ["accent", "Waiting for you"], pending: ["neutral", "Not started"], notNeeded: ["neutral", "Not needed"], next: ["neutral", "Next"], review: ["accent", "Your turn: review"]
  };
  function chip(kind) { var c = STEP_CHIP[kind] || ["neutral", kind]; return '<span class="chip ' + c[0] + '">' + esc(c[1]) + "</span>"; }

  // Green, orange and red mean test status; the accent means "your turn"; everything else is neutral.
  var STATUS_TONE = { Draft: "neutral", Verified: "ok", Updated: "line", New: "neutral", Blocked: "warn", "Possible defect": "err", Existing: "line", Outdated: "warn", Obsolete: "neutral" };
  var STATUS_COLOR = { Draft: "var(--border)", Verified: "var(--ok-solid)", Updated: "var(--fg-2)", New: "var(--series-3)", Blocked: "var(--warn-solid)", "Possible defect": "var(--err-solid)", Existing: "var(--fg-2)", Outdated: "var(--warn-solid)", Obsolete: "var(--fg-muted)" };
  function statusChip(s) { return '<span class="chip ' + (STATUS_TONE[s] || "neutral") + '">' + esc(s || "—") + "</span>"; }
  function countsBar(counts, total) {
    if (!total) return '<div class="bar" aria-hidden="true"></div>';
    var parts = Object.keys(counts).map(function (k) { return '<span style="width:' + (100 * counts[k] / total) + "%;background:" + (STATUS_COLOR[k] || "var(--fg-muted)") + '" title="' + esc(k + ": " + counts[k]) + '"></span>'; });
    var label = Object.keys(counts).map(function (k) { return counts[k] + " " + k; }).join(", ");
    return '<div class="bar" role="img" aria-label="' + esc(label) + '">' + parts.join("") + "</div>";
  }
  function emptyBox(html) { return '<div class="card empty">' + html + "</div>"; }

  /** Relative links in a rendered document point at files next to it: .md opens in the viewer, the rest raw. */
  function fixLinks(rootEl, baseFile) {
    var dir = (baseFile || "").split("/").slice(0, -1);
    rootEl.querySelectorAll("a[href]").forEach(function (a) {
      var h = a.getAttribute("href");
      if (/^https?:/i.test(h)) { a.target = "_blank"; a.rel = "noopener noreferrer"; return; }
      if (/^(#|mailto:)/i.test(h)) return;
      var parts = dir.slice();
      h.split("#")[0].split("/").forEach(function (seg) { if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg); });
      var p = parts.join("/");
      if (/\.md$/i.test(p)) a.href = "#doc/" + encodeURIComponent(p);
      else { a.href = rawHref(p); a.target = "_blank"; a.rel = "noopener"; }
    });
  }

  // ── Shared pieces ────────────────────────────────────────────────────────
  var STORY_STEP_NAME = { "story-pull": "Pull", "story-design": "Design", "story-explore": "Explore", "story-script": "Automate", "story-run": "Run" };
  var SUITE_DOING = { analyst: "The Analyst is exploring the app", "qa-planner": "The QA Planner is writing the test plan", "qa-engineer": "The QA Engineer is writing the test cases and specs", "qa-reviewer": "The QA Reviewer is checking the selectors", "qa-reporter": "The QA Reporter is running the tests" };
  var NUM = ["no", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many || one + "s"); }
  function count(n, one, many) { return (n < 10 ? NUM[n] : n) + " " + (n === 1 ? one : many || one + "s"); }
  function cmdBox(cmd) { return '<span class="cmd"><code>' + esc(cmd) + '</code><button class="btn ghost sm" type="button" data-copy="' + esc(cmd) + '">Copy</button></span>'; }
  function clock(iso) { if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return ""; var t = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + ", " + t; }
  function suiteDocLink(p, label) { return '<a href="#suite/' + encodeURIComponent(p) + '">' + esc(label || p.split("/").pop()) + "</a>"; }
  function stepById(id) { return state.suite.steps.filter(function (x) { return x.id === id; })[0]; }
  function isWaitingStory(s) { return !!(s.review && s.next && !s.running); }
  function defectCount(s) { return (s.counts && s.counts["Possible defect"]) || 0; }

  /** The five steps as a track: bar widths follow how long each step took (or has been running). */
  function timeline(steps, linkFn) {
    var now = STATIC ? Date.parse(state.generatedAt) : Date.now(), pausedIdx = -1;
    steps.forEach(function (x, i) { if (x.state === "paused") pausedIdx = i; });
    return '<ol class="tl" aria-label="Pipeline steps">' + steps.map(function (x, i) {
      var ms = x.state === "running" && x.startedAt ? now - Date.parse(x.startedAt) : x.durationMs;
      var sized = ms > 0 && (x.state === "done" || x.state === "running" || x.state === "failed" || x.state === "paused");
      var style = sized ? "flex:" + Math.max(1, Math.round(ms / 1000)) + " 1 0" : "flex:0 0 150px";
      var line2 = x.state === "done" ? (x.durationMs ? "Done in " + fmtDur(x.durationMs) : "Done")
        : x.state === "running" ? "Running" + (ms > 0 ? " for " + fmtDur(ms) : "")
        : x.state === "paused" ? "Waiting for you"
        : x.state === "failed" ? "Failed"
        : x.state === "skipped" ? "Skipped"
        : pausedIdx >= 0 && i === pausedIdx + 1 ? "Next, after you continue" : "Not started";
      var out = x.outputInfo || {};
      var line3 = x.note ? '<span class="muted">' + esc(x.note) + "</span>"
        : out.exists && /\.\w+$/.test(out.path) ? '<span class="mono">' + linkFn(out.path) + "</span>"
        : out.exists && (out.dir || !/\.\w+$/.test(out.path)) ? '<a href="#results">' + esc(plural(state.suite.specs.length, "spec")) + "</a>"
        : x.state === "running" || x.state === "pending" ? '<span class="muted">' + esc(x.role) + "</span>" : "";
      return '<li class="seg s-' + esc(x.state) + '" style="' + style + '"><span class="tl-bar" aria-hidden="true"></span><span class="tl-text"><span class="tl-name"><span class="mono muted">' + (i + 1) + "</span><b>" + esc(x.name) + "</b></span>" +
        '<span class="' + (x.state === "running" || x.state === "paused" || x.state === "failed" ? "" : "muted") + '">' + esc(line2) + "</span>" + line3 + "</span></li>";
    }).join("") + "</ol>";
  }

  /** Five small segments for a story's steps. */
  function storyTrack(s) {
    var label = storyWhere(s);
    return '<span class="mini" role="img" aria-label="' + esc(label) + '">' + s.steps.map(function (st) {
      var k = st.state === "running" ? "running" : st.state === "failed" ? "failed" : st.notNeeded ? "skip" : st.done ? "done" : s.next === st.id && s.review ? "turn" : "todo";
      return '<i class="m-' + k + '"></i>';
    }).join("") + "</span>";
  }
  function storyWhere(s) {
    if (s.running) return (STORY_STEP_NAME[s.running] || s.running) + " is running";
    var failed = s.steps.filter(function (x) { return x.state === "failed"; })[0];
    if (failed) return failed.name + " failed";
    if (!s.next) return s.lastRun ? "Done, " + s.lastRun.passed + " of " + (s.lastRun.passed + s.lastRun.failed + s.lastRun.flaky + s.lastRun.skipped) + " passed" : "Done";
    if (s.review) return "Review before " + (STORY_STEP_NAME[s.next] || s.next);
    return "Ready for " + (STORY_STEP_NAME[s.next] || s.next);
  }
  function lastRunText(r) { return r ? r.passed + " of " + (r.passed + r.failed + r.flaky + r.skipped) + " passed, " + r.date : "Not run yet"; }

  function storiesTable(stories) {
    return '<div class="card tbl-card"><table class="tbl st-tbl"><thead><tr><th>Story</th><th>Progress</th><th>Test cases</th><th>Last run</th></tr></thead><tbody>' + stories.map(function (s) {

  var storyCache = null, caseFilter = {};

  function caseGroups(s, filter) {

        var dots = c[7].map(function (col) { return '<i style="background:' + col + '"></i>'; }).join("");
        return '<label class="theme-card"><span class="swatch" aria-hidden="true" style="background:' + c[2] + '"><span class="sw-top" style="background:' + c[3] + '"><i style="background:' + c[4] + '"></i></span><span class="sw-body"><span class="sw-dots">' + dots + '</span><span class="sw-btn" style="background:' + c[5] + ";color:" + c[6] + '">Your turn</span></span></span>' +
          '<span class="head"><input type="radio" name="s-theme" value="' + c[0] + '"' + (settingsDraft.theme === c[0] ? " checked" : "") + ">" + esc(LOOK.theme[c[0]]) + '</span><span class="desc">' + esc(c[1]) + "</span></label>";
      }).join("") + "</div></fieldset>";
      html += '<fieldset><legend>Mode</legend><div class="choices">' + [["light", "Light"], ["dark", "Dark"], ["system", "Match my computer"]].map(function (o) {
        return '<label class="choice"><input type="radio" name="s-mode" value="' + o[0] + '"' + (settingsDraft.mode === o[0] ? " checked" : "") + ">" + esc(o[1]) + "</label>";
      }).join("") + "</div></fieldset>";
      html += '<fieldset><legend>Density</legend><div class="choices">' + [["comfortable", "Comfortable"], ["compact", "Compact"]].map(function (o) {
        return '<label class="choice"><input type="radio" name="s-density" value="' + o[0] + '"' + (settingsDraft.density === o[0] ? " checked" : "") + ">" + esc(o[1]) + "</label>";
      }).join("") + "</div></fieldset>";
      html += '<fieldset class="card save-box"><legend>Save as</legend><div class="choices">' +
        '<label class="choice block"><input type="radio" name="s-scope" value="browser"' + (settingsScope === "browser" ? " checked" : "") + '><span><b>This browser only</b><small>Only you see it, on this computer. Teammates keep the project default.</small></span></label>' +
        '<label class="choice block"><input type="radio" name="s-scope" value="project"' + (settingsScope === "project" ? " checked" : "") + (STATIC ? " disabled" : "") + '><span><b>Project default for everyone</b><small>' + (STATIC ? "Not available in a saved snapshot. Open the live dashboard to save it." : "Saved to " + esc(cfg.file) + ". Commit the file to share it with your team.") + "</small></span></label></div>" +
        '<pre id="settingsFile" aria-label="What will be saved"></pre>' +
        '<div class="actions"><span class="grow" id="settingsStatus" role="status"></span><button class="btn ghost" type="button" id="settingsDiscard">Discard changes</button><button class="btn" type="submit" id="settingsSave">Save</button></div></fieldset>';
      html += "</div>";
      var b = browserLook();
      html += '<aside class="card pad wins"><h2 style="margin-top:0">Which setting wins</h2><ol><li>What you saved for this browser</li><li>The project default in <code>' + esc(cfg.file) + "</code></li><li>The built-in look: Geist, matching your computer, comfortable</li></ol>" +
        "<dl><dt>This browser</dt><dd>" + esc(describeLook(b)) + "</dd><dt>Project default</dt><dd>" + esc(describeLook(cfg.appearance)) + "</dd><dt>Showing now</dt><dd>" + esc(describeLook(effectiveLook())) + "</dd></dl>" +
        (b ? '<button class="btn ghost" type="button" id="settingsForget">Use the project default in this browser</button>' : "") + "</aside>";
      html += "</form>";
      main.innerHTML = html;
      wireSettings(cfg);
    }).catch(showError);
  }

  function wireSettings(cfg) {
    var form = document.getElementById("settingsForm");
    if (!form) return;
    function refresh() {
      var changed = !sameLook(settingsDraft, effectiveLook());
      document.getElementById("settingsFile").textContent = settingsScope === "project"
        ? cfg.file + "\n" + JSON.stringify({ appearance: settingsDraft }, null, 2)
        : "Saved in this browser only:\n" + describeLook(settingsDraft);
      document.getElementById("settingsStatus").textContent = changed ? "Not saved yet. You're previewing " + describeLook(settingsDraft) + "." : "No unsaved changes.";
      document.getElementById("settingsSave").textContent = settingsScope === "project" ? "Save as project default" : "Save for this browser";
    }
    form.addEventListener("change", function (e) {
      var i = e.target;
      if (!i || !i.name) return;
      if (i.name === "s-scope") settingsScope = i.value;
      else { settingsDraft[i.name.slice(2)] = i.value; applyLook(settingsDraft); }
      refresh();
    });
    document.getElementById("settingsDiscard").addEventListener("click", function () {
      settingsDraft = effectiveLook();
      applyLook(settingsDraft);
      viewSettings();
    });
    var forget = document.getElementById("settingsForget");
    if (forget) forget.addEventListener("click", function () {
      Object.keys(LS_KEYS).forEach(function (k) { lsDel(LS_KEYS[k]); });
      settingsDraft = effectiveLook();
      applyLook(settingsDraft);
      viewSettings("This browser now uses the project default.");
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var look = { theme: settingsDraft.theme, mode: settingsDraft.mode, density: settingsDraft.density };
      if (settingsScope === "browser") {
        var ok = Object.keys(LS_KEYS).every(function (k) { return lsSet(LS_KEYS[k], look[k]); });
        if (!ok) return showError("This browser doesn't allow saving settings. Save it as the project default instead.");
        applyLook(effectiveLook());
        return viewSettings("Saved for this browser.");
      }
      var btn = document.getElementById("settingsSave");
      btn.disabled = true;
      btn.textContent = "Saving…";
      fetch("api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ appearance: look }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.statusText); return j; }); })
        .then(function (res) {
          window.__AGENTIC_QA_APPEARANCE__ = res.appearance || look;
          // This browser follows the new project default, so what you saved is what you see.
          Object.keys(LS_KEYS).forEach(function (k) { lsDel(LS_KEYS[k]); });
          settingsDraft = effectiveLook();
          applyLook(settingsDraft);
          viewSettings("Saved as the project default in " + res.file + ". This browser now follows it.");
        })
        .catch(function (err) { btn.disabled = false; refresh(); showError(err); });
    });
    refresh();
  }

  function showError(err) { main.innerHTML = '<div class="err-box" role="alert">' + esc(err && err.message ? err.message : err) + "</div>"; }

  function render(scrollTop) {
    route = parseRoute();
    if (route.v !== "settings" && settingsDraft) { settingsDraft = null; applyLook(effectiveLook()); }
    document.querySelectorAll(".rail a").forEach(function (a) {
      var v = a.getAttribute("data-view");
      var on = v === route.v || (v === "stories" && route.v === "story") || (v === "suite" && route.v === "doc");
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (!state) return;
    document.getElementById("proj").textContent = state.project;
    document.title = state.project + " · Agentic QA Dashboard";
    if (!state.hasData && route.v !== "doc" && route.v !== "models" && route.v !== "settings") {
      main.innerHTML = "<h1>Nothing here yet</h1>" + emptyBox("<p>This project has no <code>.agentic-qa/</code> folder yet.</p><p>Run <code>/qa-pipeline &lt;url&gt;</code> for a full suite, or <code>/qa-story &lt;KEY&gt;</code> for one story. This page updates as files appear.</p>");
      return;
    }
    if (route.v === "stories") viewStories();
    else if (route.v === "story" && route.arg) { var parts = route.arg.split("/"); viewStory(parts[0], parts[1], parts[2]); }
    else if (route.v === "suite") viewSuite(route.arg);
    else if (route.v === "results") viewResults();
    else if (route.v === "models") viewModels();
    else if (route.v === "settings") viewSettings();
    else if (route.v === "doc" && route.arg) viewDoc(route.arg);
    else viewNow();
    if (scrollTop) window.scrollTo(0, 0);
  }

  /** Copy buttons next to commands: the command goes to the clipboard, and the button says so for a moment. */
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-copy]");
    if (!b) return;
    var text = b.getAttribute("data-copy");
    var done = function (ok) { b.textContent = ok ? "Copied" : "Select and copy"; setTimeout(function () { b.textContent = "Copy"; }, 1600); };
    if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    else {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      document.body.removeChild(ta); done(ok);
    }
  });

  function setLive(kind, text) {
    var el = document.getElementById("live");
    el.className = "live" + (kind ? " " + kind : "");
    document.getElementById("liveText").textContent = text;
  }

  function poll() {
    api("api/state").then(function (s) {
      var json = JSON.stringify(Object.assign({}, s, { generatedAt: "" }));
      state = s;
      if (STATIC) setLive("snapshot", "Snapshot · " + fmtTime(s.generatedAt));
      else setLive("", "Live · " + new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" }));
      // Re-render only when something changed, and leave documents and the Models form alone while they're in use.
      if (json !== lastJson) {
        var first = !lastJson;
        lastJson = json;
        if (first || (route.v !== "doc" && route.v !== "models" && route.v !== "settings")) render(false);
      }
    }).catch(function () { setLive("stale", "Disconnected — is the dashboard still running?"); });
  }

  // Moving within a page (another document in the suite reader, another case of the same story) keeps the scroll position.
  var lastRoute = parseRoute();
  window.addEventListener("hashchange", function () {
    var r = parseRoute(), key = function (x) { return x.v === "story" ? "story/" + (x.arg || "").split("/")[0] : x.v; };
    var samePage = key(r) === key(lastRoute) && (r.v === "suite" || r.v === "story");
    lastRoute = r;
    render(!samePage);
    if (!samePage) main.focus({ preventScroll: true });
  });
  poll();
  if (!STATIC) setInterval(poll, 2000);
})();
</script>
</body>
</html>
